[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smda-scheduler"
version = "0.1.0"
description = "State-machine-driven automation scheduler for agentic software development"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
smda-scheduler = "smda_scheduler.cli:main"

[tool.setuptools]
package-dir = {"" = "packages/scheduler/src"}

[tool.setuptools.packages.find]
where = ["packages/scheduler/src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/scheduler/tests"]
pythonpath = ["packages/scheduler/src"]
