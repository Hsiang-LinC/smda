name: Build SMDA plugin runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin semantic version, without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          if re.fullmatch(
              r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", version
          ) is None:
              raise SystemExit(f"invalid semantic version: {version!r}")
          manifests = (
              Path("plugins/smda-automation/.codex-plugin/plugin.json"),
              Path("plugins/smda-automation/.claude-plugin/plugin.json"),
          )
          for manifest in manifests:
              actual = json.loads(manifest.read_text())["version"]
              if actual != version:
                  raise SystemExit(f"{manifest}: expected {version}, found {actual}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"version={version}", file=output)
          PY

  build-arm64:
    needs: validate-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --frozen --group dev
      - run: uv run --python 3.12 --frozen python scripts/build_standalone_runtime.py --output-root artifacts
      - run: tar -czf runtime-darwin-arm64.tar.gz -C artifacts/darwin-arm64 smda
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-darwin-arm64
          path: runtime-darwin-arm64.tar.gz
          if-no-files-found: error

  build-x86_64:
    needs: validate-release
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --frozen --group dev
      - run: uv run --python 3.12 --frozen python scripts/build_standalone_runtime.py --output-root artifacts
      - run: tar -czf runtime-darwin-x86_64.tar.gz -C artifacts/darwin-x86_64 smda
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-darwin-x86_64
          path: runtime-darwin-x86_64.tar.gz
          if-no-files-found: error

  assemble-plugin:
    needs: [validate-release, build-arm64, build-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: runtime-darwin-arm64
          path: release/arm64
      - uses: actions/download-artifact@v7
        with:
          name: runtime-darwin-x86_64
          path: release/x86_64
      - run: |
          mkdir -p plugins/smda-automation/runtime/bin/darwin-arm64
          mkdir -p plugins/smda-automation/runtime/bin/darwin-x86_64
          tar -xzf release/arm64/runtime-darwin-arm64.tar.gz -C plugins/smda-automation/runtime/bin/darwin-arm64
          tar -xzf release/x86_64/runtime-darwin-x86_64.tar.gz -C plugins/smda-automation/runtime/bin/darwin-x86_64
          test -x plugins/smda-automation/runtime/bin/darwin-arm64/smda/smda
          test -x plugins/smda-automation/runtime/bin/darwin-x86_64/smda/smda
          tar -czf smda-automation-${{ needs.validate-release.outputs.version }}.tar.gz -C plugins smda-automation
      - uses: actions/upload-artifact@v7
        with:
          name: smda-automation-${{ needs.validate-release.outputs.version }}
          path: smda-automation-${{ needs.validate-release.outputs.version }}.tar.gz
          if-no-files-found: error
